<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src blob: data:; connect-src https://api.anthropic.com https://*.supabase.co; base-uri 'none'">
<title>Tempo — Smart Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f0;--panel:#fff;--ink:#16201a;--mute:#66726a;--line:#e1e5dc;--acc:#3d3df5;--acc-ink:#fff;--soft:#e8e8ff;--bad:#e8452c;--badsoft:#ffe5df;--ok:#1f9d63;--oksoft:#d7f3e4;--warn:#f0a020}
@media(prefers-color-scheme:dark){:root{--bg:#101612;--panel:#18211b;--ink:#eef2ec;--mute:#93a198;--line:#27332b;--acc:#8b8bff;--acc-ink:#101612;--soft:#26264a;--badsoft:#3b1f19;--oksoft:#173326}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif;display:grid;grid-template-columns:220px 1fr;min-height:100vh}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:2.2rem;line-height:1.1;font-weight:700}h2{font-size:1.15rem;font-weight:700;margin-bottom:10px}h3{font-size:1rem;font-weight:500}
nav{padding:26px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-size:1.6rem;font-weight:700;padding:0 10px 16px}
nav a{padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;cursor:pointer}
nav a.on{background:var(--ink);color:var(--bg)}
.tip{font-size:.82rem;color:var(--mute);background:var(--soft);border-radius:12px;padding:12px}
main{padding:34px clamp(16px,4vw,52px) 110px;max-width:1080px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--mute)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:500}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.ghost{border-color:transparent;background:none;color:var(--mute);padding:6px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.span{grid-column:1/-1}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.quick{display:flex;gap:10px;margin-bottom:8px}.quick input{font-size:1rem;padding:12px 15px}
.hint,.meta{color:var(--mute);font-size:.85rem}.hint{margin:0 0 20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}.stat b{display:block;font:700 1.7rem 'Bricolage Grotesque';letter-spacing:-.03em}
.slot{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--acc);margin-top:8px}
.slot small{color:var(--mute)}.slot.brk{opacity:.65}
.tag{display:inline-block;font-size:.76rem;padding:1px 9px;border-radius:99px;background:var(--soft);margin-right:6px}
.tag.high{background:var(--badsoft);color:var(--bad)}.tag.low{background:var(--oksoft);color:var(--ok)}.tag.od{background:var(--bad);color:#fff}.tag.progress{background:#fff1d0;color:#8a5a00}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.li:first-of-type{border-top:0}
.task{padding:14px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task.done h3{text-decoration:line-through;color:var(--mute)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);padding:0;flex:none}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.detail{margin:10px 0 0 34px;padding:12px;background:var(--bg);border-radius:10px;white-space:pre-wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button.on{background:var(--ink);color:var(--bg)}
.filters{display:grid;grid-template-columns:1fr 150px 150px;gap:10px;margin-bottom:12px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.coach{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px}
.active{background:var(--ink);color:var(--bg);text-align:center;padding:24px}.active b{display:block;font:700 2.6rem 'Bricolage Grotesque';font-variant-numeric:tabular-nums}
.active button{background:var(--bg);color:var(--ink)}
.dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px #0004;z-index:5}
.dock button{background:var(--bg);color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:22px;width:min(480px,92vw);max-height:90vh}
dialog::backdrop{background:#0008}dialog label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:10px;flex-wrap:wrap}.days label{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)}
.empty{color:var(--mute);padding:14px 0;margin:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cf{position:fixed;top:-30px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:9;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.locked{grid-template-columns:1fr}.locked nav{display:none}
@media(max-width:800px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border:0;border-bottom:1px solid var(--line);padding:12px}.brand{padding:0 10px 0 0}.tip{display:none}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.slot{grid-template-columns:78px 1fr}.slot>:last-child{grid-column:2}}
</style>
</head>
<body>
<nav>
  <div class="brand">Tempo</div>
  <a data-v="dash">Dashboard</a><a data-v="tasks">Tasks</a><a data-v="sched">Schedule</a><a data-v="stats">Analytics</a>
  <a id="settings">AI settings</a><a id="lock">Sign out</a>
  <div style="flex:1"></div>
  <div class="meta" id="who" style="word-break:break-all"></div><div class="meta" id="sync" style="margin-bottom:8px"></div>
  <div class="tip">Tip: press <b>Plan my day</b> and Tempo fits your tasks around your classes. Or snap a photo of your homework list.</div>
</nav>
<main id="app"></main>
<div id="dock" class="dock" hidden></div>
<dialog id="dlg"></dialog>
<input type="file" id="photo" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- state ---------- */
const KEY='tempo-planner-v1',DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],CATS=['School','Personal','Work','Health','Other'];
const W={high:3,medium:2,low:1},COL=['#3d3df5','#e8452c','#1f9d63','#f0a020','#a13dc4','#0a9db8','#888888'];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
/* ---------- accounts: Supabase Auth (email + password, reset by email). Data lives in one row per user, protected by Row Level Security. ---------- */
const SUPABASE_URL='',SUPABASE_ANON_KEY='';   // paste yours here (see README). The anon key is safe to publish; RLS protects the data.
const blank=()=>({tasks:[],classes:[],events:[],blocks:[],logs:[],plan:null,avail:{},apiKey:'',model:'claude-sonnet-5-5',timer:null});
let S=blank(),USER=null,saveT,entering=false,booting=true,authMode=/type=recovery/.test(location.hash)?'reset':'in',authMsg='';
const CONFIGURED=!!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);
const sb=CONFIGURED?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const HOME=location.origin+location.pathname;
const LOCAL=!CONFIGURED;   // no Supabase keys: accounts live on this device, encrypted, with a recovery code instead of email reset
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)},unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const emailId=async e=>'tempo:acct:'+hex(await crypto.subtle.digest('SHA-256',enc.encode(e.trim().toLowerCase())));
const KDF=async(secret,salt)=>{const m=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const aes=async(key,bytes)=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}};
const unaes=async(key,o)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(o.iv)},key,unb(o.ct)));
const newCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return [...crypto.getRandomValues(new Uint8Array(16))].map(x=>A[x%32]).join('').replace(/(.{4})(?!$)/g,'$1-')};
const normCode=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
let LK=null,LID=null,LREC=null,LEMAIL='',newCodeShown='';
const useKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function localFlush(){LREC.d=await aes(LK,enc.encode(JSON.stringify({...S,apiKey:''})));localStorage.setItem(LID,JSON.stringify(LREC))}
async function localSignUp(email,pw){
  const id=await emailId(email);if(localStorage.getItem(id))throw new Error('An account with that email already exists on this device.');
  const raw=rnd(32),code=newCode(),s1=rnd(16),s2=rnd(16);
  LREC={s1:b64(s1),s2:b64(s2),wp:await aes(await KDF(pw,s1),raw),wr:await aes(await KDF(normCode(code),s2),raw)};
  LID=id;LK=await useKey(raw);LEMAIL=email.trim().toLowerCase();S=blank();await localFlush();return code}
async function localSignIn(email,pw){
  const id=await emailId(email),r=localStorage.getItem(id);if(!r)throw new Error('No account with that email on this device. Create one first.');
  const rec=JSON.parse(r);let raw;try{raw=await unaes(await KDF(pw,unb(rec.s1)),rec.wp)}catch{throw new Error('Wrong email or password.')}
  LID=id;LREC=rec;LK=await useKey(raw);LEMAIL=email.trim().toLowerCase();
  let st=blank();if(rec.d)st=JSON.parse(dec.decode(await unaes(LK,rec.d)));
  S=Object.assign(blank(),st);S.tasks.forEach(t=>{if(!t.status)t.status=t.done?'done':'pending'});}
async function localReset(email,code,pw){
  const id=await emailId(email),r=localStorage.getItem(id);if(!r)throw new Error('No account with that email on this device.');
  const rec=JSON.parse(r);let raw;try{raw=await unaes(await KDF(normCode(code),unb(rec.s2)),rec.wr)}catch{throw new Error('That recovery code does not match.')}
  const s1=rnd(16),s2=rnd(16),nc=newCode();rec.s1=b64(s1);rec.s2=b64(s2);rec.wp=await aes(await KDF(pw,s1),raw);rec.wr=await aes(await KDF(normCode(nc),s2),raw);
  localStorage.setItem(id,JSON.stringify(rec));return nc}
function enterLocal(){USER={email:LEMAIL,id:LID};view='dash';authMsg='';try{S.apiKey=sessionStorage.getItem('tempo:key')||''}catch{}render()}
const setSync=t=>{const x=$('#sync');if(x)x.textContent=t};
async function flush(){if(!USER)return;if(LOCAL){try{await localFlush();setSync('Saved on this device')}catch{setSync('Not saved')}return}const{error}=await sb.from('planners').upsert({user_id:USER.id,data:{...S,apiKey:''},updated_at:new Date().toISOString()});setSync(error?'Not saved. Check your connection.':'Saved')}
const save=()=>{if(!USER)return;clearTimeout(saveT);setSync('Saving…');saveT=setTimeout(flush,600)};
async function enter(session){
  if(entering)return;entering=true;
  const{data,error}=await sb.from('planners').select('data').eq('user_id',session.user.id).maybeSingle();
  entering=false;
  if(error){authMsg='Could not load your data: '+error.message;render();return}
  S=Object.assign(blank(),data?.data||{});S.tasks.forEach(t=>{if(!t.status)t.status=t.done?'done':'pending'});
  try{S.apiKey=sessionStorage.getItem('tempo:key')||''}catch{}
  USER=session.user;view='dash';authMsg='';render();
}
async function lock(){   // sign out
  clearTimeout(saveT);try{await flush()}catch{}
  USER=null;S=blank();coach='';view='dash';selMode=false;sel.clear();exp.clear();authMode='in';authMsg='';
  try{sessionStorage.removeItem('tempo:key')}catch{}
  if($('#dlg').open)$('#dlg').close();LK=LREC=LID=null;render();if(sb)await sb.auth.signOut();
}
if(sb)sb.auth.onAuthStateChange((ev,session)=>{setTimeout(async()=>{
  if(ev==='PASSWORD_RECOVERY')authMode='reset';
  if(session&&!USER&&authMode!=='reset')await enter(session);
  booting=false;if(!USER)render();
},0)});
else booting=false;
function authScreen(){
  const m=authMode,title={in:'Sign in',up:'Create your account',forgot:'Reset your password',reset:'Choose a new password'}[m];
  const link=(id,t)=>`<button type="button" class="ghost" data-a="amode" data-id="${id}">${t}</button>`;
  if(m==='code'){$('#app').innerHTML=`<div class="panel" style="max-width:440px;margin:8vh auto"><h1>Tempo</h1><h2 style="margin-top:18px">Save your recovery code</h2>
    <p>If you ever forget your password, this code is the only way back into your planner. Nobody can email it to you, so keep it somewhere safe.</p>
    <div class="panel" style="text-align:center;font:700 1.4rem 'Bricolage Grotesque';letter-spacing:.04em;margin:14px 0;background:var(--bg)">${esc(newCodeShown)}</div>
    <div class="row wrap"><button data-a="copycode">Copy</button><button data-a="dlcode">Download</button></div>
    <button class="pri" style="width:100%;margin-top:14px" data-a="cont">I saved it. Open my planner</button></div>`;return}
  $('#app').innerHTML=`<div class="panel" style="max-width:420px;margin:8vh auto"><h1>Tempo</h1><p class="meta" style="margin-top:6px">A planner that works around your real week.</p>
  ${booting?'<p class="meta">Loading…</p>':`<h2 style="margin-top:18px">${title}</h2>
  ${LOCAL?'<p class="meta">Your account is stored on this device and encrypted with your password. Forgot it? Use your recovery code.</p>':''}
  <form id="au">${m==='reset'?'':'<label for="em">Email</label><input id="em" type="email" name="e" required autocomplete="email">'}
  ${LOCAL&&m==='forgot'?'<label for="rc">Recovery code</label><input id="rc" name="rc" required autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX">':''}
  ${m==='forgot'&&!LOCAL?'':`<label for="pw">${m==='in'?'Password':'New password'}</label><input id="pw" type="password" name="p" required ${m==='in'?'':'minlength="8"'} autocomplete="${m==='in'?'current-password':'new-password'}">${m==='in'?'':'<p class="meta" style="margin:4px 0 0">At least 8 characters.</p>'}`}
  <p id="err" role="alert" style="min-height:1.4em;margin:10px 0">${esc(authMsg)}</p>
  <button class="pri" style="width:100%">${{in:'Sign in',up:'Create account',forgot:LOCAL?'Reset password':'Email me a reset link',reset:'Save new password'}[m]}</button></form>
  <div class="row wrap" style="margin-top:12px;justify-content:space-between">${m==='in'?link('up','Create account')+link('forgot','Forgot password?'):m==='reset'?'':link('in','Back to sign in')}</div>`}</div>`;
}
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#f0a020';
let view='dash',stab='classes',filter='all',query='',fcat='',fpri='',coach='',selMode=false;
const sel=new Set(),exp=new Set();

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const isoLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey=d=>isoLocal(new Date(d)).slice(0,10);
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>{const h=Math.floor(m/60);return `${(h+11)%12+1}:${pad(m%60)} ${h>=12?'PM':'AM'}`};
const dur=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const fmtDue=s=>new Date(s).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logged=id=>S.logs.filter(l=>l.taskId===id).reduce((a,l)=>a+l.mins,0);
const isOpen=t=>t.status!=='done',overdue=t=>isOpen(t)&&new Date(t.due)<new Date();
const byDue=(a,b)=>new Date(a.due)-new Date(b.due);
const sum=a=>a.reduce((x,y)=>x+y,0);
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
const avail=d=>S.avail[d]||{on:true,start:'08:00',end:'21:00'};
/* self-calibrating estimates: Tempo learns how long your tasks really take */
const factor=()=>{const d=S.tasks.filter(t=>t.status==='done'&&logged(t.id)>0),e=sum(d.map(t=>t.est));return e&&d.length>=2?Math.min(2,Math.max(.7,sum(d.map(t=>logged(t.id)))/e)):1};
const need=t=>Math.max(5,Math.round(t.est*factor())-logged(t.id));
/* XP, levels, streaks */
const xp=()=>sum(S.tasks.filter(t=>t.status==='done').map(t=>10+W[t.priority]*5+(new Date(t.doneAt)<=new Date(t.due)?10:0)))+Math.floor(sum(S.logs.map(l=>l.mins))/5);
const streak=()=>{const ds=new Set([...S.logs.map(l=>dayKey(l.date)),...S.tasks.filter(t=>t.doneAt).map(t=>dayKey(t.doneAt))]);let n=0,d=new Date();if(!ds.has(dayKey(d)))d.setDate(d.getDate()-1);while(ds.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n};
function levelHTML(){const x=xp(),L=Math.floor(Math.sqrt(x/50))+1,lo=50*(L-1)**2,hi=50*L*L;
  return `<div class="panel row" style="margin-bottom:16px"><div style="font:700 1.6rem 'Bricolage Grotesque'">Lv ${L}</div><div class="grow"><div class="meta">${x} XP · ${hi-x} to level ${L+1}</div><div class="bar" style="margin-top:6px"><i style="width:${(x-lo)/(hi-lo)*100}%"></i></div></div><div><b>${streak()}</b> day streak</div></div>`}
/* 7-day workload forecast: spreads remaining work over the days before each deadline */
function forecast(){
  const now=new Date(),days=[...Array(7)].map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()+i);const a=avail(d.getDay()),el=i?0:Math.max(0,now.getHours()*60+now.getMinutes()-toMin(a.start));
    return{d,need:0,free:a.on?Math.max(0,toMin(a.end)-toMin(a.start)-sum(busyFor(d).map(b=>b.e-b.s))-el):0}});
  S.tasks.filter(isOpen).forEach(t=>{const idx=Math.min(6,Math.max(0,Math.floor((new Date(t.due)-now)/864e5)));for(let i=0;i<=idx;i++)days[i].need+=need(t)/(idx+1)});
  return days}
function forecastHTML(){
  const fc=forecast(),bad=fc.filter(d=>d.need>0&&d.need>=d.free);
  const col=d=>!d.need?'var(--line)':d.need>=d.free?'var(--bad)':d.need>d.free*.7?'var(--warn)':'var(--ok)';
  return `<div class="panel span"><h2>Workload forecast: next 7 days</h2><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${fc.map(d=>`<div style="text-align:center"><div class="bar" style="height:70px;display:flex;align-items:flex-end;border-radius:10px"><i style="width:100%;height:${d.free?Math.min(100,d.need/d.free*100):d.need?100:0}%;background:${col(d)}"></i></div><div class="meta">${DAYS[d.d.getDay()]}</div><div class="meta">${dur(Math.round(d.need))}</div></div>`).join('')}</div>
  <p class="meta" style="margin:10px 0 0">${bad.length?`Warning: ${bad.map(d=>DAYS[d.d.getDay()]).join(', ')} ${bad.length>1?'are':'is'} overloaded. Move a deadline, add availability, or break a task down.`:'Your load looks manageable.'} Plans use your real pace (×${factor().toFixed(2)} your estimates).</p></div>`}

/* ---------- quick add: plain English -> task ---------- */
function parseQuick(text){
  let s=text,t={id:uid(),status:'pending',priority:'medium',category:'School',est:30,repeat:false,notes:''};
  const take=(re,fn)=>{const m=s.match(re);if(m){fn(m);s=s.replace(re,' ')}};
  take(/\b(high|urgent|!!)\b/i,()=>t.priority='high');take(/\blow\b/i,()=>t.priority='low');
  take(/\b(\d+(?:\.\d+)?)\s?(?:h|hr|hrs|hours?)\b/i,m=>t.est=Math.round(m[1]*60));
  take(/\b(\d+)\s?(?:m|min|mins|minutes?)\b/i,m=>t.est=+m[1]);
  take(/\bweekly\b/i,()=>t.repeat=true);
  CATS.forEach(c=>take(new RegExp('#'+c+'\\b','i'),()=>t.category=c));
  const d=new Date();d.setHours(23,0,0,0);
  take(/\btomorrow\b/i,()=>d.setDate(d.getDate()+1));take(/\btoday\b/i,()=>{});
  take(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i,m=>{const i=DAYS.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());d.setDate(d.getDate()+((i-d.getDay()+7)%7||7))});
  take(/\b(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\b/i,m=>d.setHours(+m[1]%12+(m[3].toLowerCase()==='pm'?12:0),+(m[2]||0),0,0));
  t.due=isoLocal(d);t.title=s.replace(/\b(due|by)\b/gi,' ').replace(/\s+/g,' ').trim()||text;return t;
}

/* ---------- planner ---------- */
function busyFor(d){
  const k=dayKey(d),w=d.getDay();
  return [...S.classes.filter(c=>c.days.includes(w)).map(c=>({...c,kind:'Class'})),
    ...S.blocks.filter(c=>c.days.includes(w)).map(c=>({...c,kind:'Time block'})),
    ...S.events.filter(e=>e.date===k).map(e=>({...e,kind:'Event'}))]
    .map(x=>({s:toMin(x.start),e:toMin(x.end),kind:x.kind,name:x.name,loc:x.loc,color:x.color})).sort((a,b)=>a.s-b.s);
}
function score(t,now){const h=(new Date(t.due)-now)/36e5;return W[t.priority]*10+(h<0?40:Math.max(0,30-h/2))}
function generatePlan(){
  const now=new Date(),av=avail(now.getDay()),busy=busyFor(now).map(b=>[b.s,b.e]);
  if(!av.on){S.plan={date:dayKey(now),items:[],leftover:0,off:true};save();render();return}
  const end=toMin(av.end);let cur=Math.max(toMin(av.start),Math.ceil((now.getHours()*60+now.getMinutes())/15)*15);
  const q=S.tasks.filter(isOpen).map(t=>({t,left:need(t),s:score(t,now)})).sort((a,b)=>b.s-a.s),items=[];
  const inBusy=m=>busy.find(([a,b])=>m>=a&&m<b);
  while(q.length&&cur<end){
    const c=inBusy(cur);if(c){cur=c[1];continue}
    const nx=busy.filter(([a])=>a>cur).sort((a,b)=>a[0]-b[0])[0],free=Math.min(end,nx?nx[0]:end)-cur;
    if(free<15){cur+=Math.max(free,1);continue}
    const x=q[0],ch=Math.min(x.left,50,free);
    items.push({taskId:x.t.id,start:cur,end:cur+ch,type:'task'});cur+=ch;x.left-=ch;if(x.left<=0)q.shift();
    if(q.length&&cur+10<=end&&!inBusy(cur)){items.push({start:cur,end:cur+10,type:'break'});cur+=10}
  }
  S.plan={date:dayKey(now),items,leftover:q.length};save();render();
}

async function claude(content,system,max=800){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.model,max_tokens:max,system,messages:[{role:'user',content}]})});
  const j=await r.json();if(j.error)throw new Error(j.error.message);return j.content.map(c=>c.text||'').join('');
}

function shrink(file){return new Promise((ok,no)=>{const i=new Image();i.onerror=()=>no(new Error('That file is not a readable image.'));
  i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};i.src=URL.createObjectURL(file)})}

   <div><span class="meta">Overdue</span><div class="stat" style="background:none;padding:0"><b>${ov.length}</b></div><div class="meta">${ov.slice(0,3).map(t=>'• '+esc(t.title)).join('<br>')}${ov.length>3?`<br>+${ov.length-3} more`:''}</div></div>
   <div><span class="meta">On-time rate</span><div class="stat" style="background:none;padding:0"><b>${pct(onT.length,past.length)}</b></div><div class="bar"><i style="width:${past.length?onT.length/past.length*100:0}%;background:var(--ok)"></i></div><span class="meta">${onT.length} of ${past.length} past-due tasks on time</span></div></div></div>
  <div class="grid"><div class="panel"><h2>Time spent (last 7 days)</h2><svg viewBox="0 0 370 152" width="100%" role="img" aria-label="Focus minutes per day">${bars}</svg></div>
  <div class="panel"><h2>Time by category</h2>${cat.length?`<div class="row"><svg viewBox="0 0 140 140" width="140" role="img" aria-label="Time by category">${arcs}</svg><div>${cat.map(x=>`<div class="row"><span class="dot" style="background:${x.col}"></span>${x.c} <span class="meta">${dur(x.m)}</span></div>`).join('')}</div></div>`:'<p class="empty">Start a timer on a task to see this.</p>'}</div></div>`;
}

/* ---------- dialogs ---------- */
function openDlg(html,onSubmit){const d=$('#dlg');d.innerHTML=`<form method="dialog" id="f">${html}<div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" data-a="close">Cancel</button><button class="pri">Save</button></div></form>`;d.showModal();$('#f').onsubmit=e=>{onSubmit(new FormData(e.target));save();render()}}
function taskForm(t){
  t=t||{title:'',notes:'',priority:'medium',category:'School',est:30,due:isoLocal(new Date(Date.now()+864e5)),repeat:false,status:'pending'};
  openDlg(`<h2>${t.id?'Edit task':'New task'}</h2><label>Title</label><input name="title" required value="${esc(t.title)}">
  <div class="two"><div><label>Priority</label><select name="priority">${opts(['high','medium','low'],t.priority)}</select></div><div><label>Category</label><select name="category">${opts(CATS,t.category)}</select></div>
  <div><label>Due</label><input type="datetime-local" name="due" required value="${t.due}"></div><div><label>Time needed (min)</label><input type="number" name="est" min="5" step="5" value="${t.est}"></div></div>
  <label>Notes</label><textarea name="notes" rows="2">${esc(t.notes)}</textarea><label class="row" style="color:var(--ink)"><input type="checkbox" name="repeat" ${t.repeat?'checked':''}> Repeats weekly</label>`,f=>{
    const o={title:f.get('title').trim(),priority:f.get('priority'),category:f.get('category'),due:f.get('due'),est:+f.get('est')||30,notes:f.get('notes'),repeat:!!f.get('repeat')};
    if(t.id)Object.assign(t,o);else S.tasks.push({id:uid(),status:'pending',...o})});
}
function schedForm(list,c){
  const ev=list==='events';c=c||{name:'',days:[],date:dayKey(new Date()),start:'16:00',end:'17:00',loc:'',color:COL[S[list].length%COL.length]};
  openDlg(`<h2>${c.id?'Edit':'Add'} ${{classes:'class',events:'event',blocks:'time block'}[list]}</h2><label>Name</label><input name="name" required value="${esc(c.name)}">
  ${ev?`<label>Date</label><input type="date" name="date" required value="${c.date}">`:`<label>Days</label><div class="days">${DAYS.map((d,i)=>`<label><input type="checkbox" name="d" value="${i}" ${c.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div>`}
  <div class="two"><div><label>Starts</label><input type="time" name="start" value="${c.start}" required></div><div><label>Ends</label><input type="time" name="end" value="${c.end}" required></div></div>
  <div class="two"><div><label>Location (optional)</label><input name="loc" value="${esc(c.loc)}"></div><div><label>Color</label><input type="color" name="color" value="${c.color}"></div></div>`,f=>{
    const o={name:f.get('name').trim(),start:f.get('start'),end:f.get('end'),loc:f.get('loc').trim(),color:f.get('color'),...(ev?{date:f.get('date')}:{days:f.getAll('d').map(Number)})};
    if(c.id)Object.assign(c,o);else S[list].push({id:uid(),...o})});
}
function openSettings(msg){
  const d=$('#dlg');d.innerHTML=`<form method="dialog" id="f"><h2>AI settings</h2><p class="meta">${esc(msg||'Optional.')} Planning works offline. The coach and photo import use Claude, which needs an Anthropic API key. The key stays in this browser tab only, is never saved to your account, and is sent only to api.anthropic.com.</p>
  <label>API key</label><input name="k" type="password" value="${esc(S.apiKey)}" placeholder="sk-ant-…"><label>Model</label><input name="m" value="${esc(S.model)}">
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" data-a="close">Cancel</button><button class="pri">Save settings</button></div></form>`;
  d.showModal();$('#f').onsubmit=e=>{const f=new FormData(e.target);S.apiKey=f.get('k').trim();try{sessionStorage.setItem('tempo:key',S.apiKey)}catch{}S.model=f.get('m').trim()||'claude-sonnet-5-5';save()};
}

/* ---------- timer + alerts ---------- */
function stopTimer(){if(!S.timer)return;S.logs.push({taskId:S.timer.id,mins:Math.max(1,Math.round((Date.now()-S.timer.start)/6e4)),date:new Date().toISOString()});S.timer=null;save()}
function tick(){
  const s=S.timer?Math.floor((Date.now()-S.timer.start)/1000):0,txt=`${pad(Math.floor(s/60))}:${pad(s%60)}`;
  if($('#live'))$('#live').textContent=txt;
  const d=$('#dock');d.hidden=!S.timer||view==='dash';
  if(!d.hidden)d.innerHTML=`<span>${esc(S.tasks.find(t=>t.id===S.timer.id)?.title||'')}</span><b>${txt}</b><button data-a="stop">Stop and log</button>`;
}
setInterval(tick,1000);
setInterval(()=>{if(!('Notification' in window)||Notification.permission!=='granted')return;
  S.tasks.filter(t=>isOpen(t)&&!t.notified&&(new Date(t.due)-Date.now())<36e5).forEach(t=>{t.notified=1;new Notification('Due soon: '+t.title,{body:'Due '+fmtDue(t.due)});save()})},6e4);

/* ---------- actions ---------- */
const get=(a,id)=>a.find(x=>x.id===id);
const A={
  plan:generatePlan,coach:askCoach,close:()=>$('#dlg').close(),photo:()=>S.apiKey?$('#photo').click():openSettings('Add an API key to read photos.'),
  quick(){const v=$('#qa').value.trim();if(!v)return;S.tasks.push(parseQuick(v));save();render()},
  new:()=>taskForm(),edit:id=>taskForm(get(S.tasks,id)),
  del(id){S.tasks=S.tasks.filter(t=>t.id!==id);save();render()},
  filter(id){filter=id;render()},stab(id){stab=id;render()},
  adds:()=>schedForm(stab),edits:id=>schedForm(stab,get(S[stab],id)),dels(id){S[stab]=S[stab].filter(x=>x.id!==id);save();render()},
  exp(id){exp.has(id)?exp.delete(id):exp.add(id);render()},
  selmode(){selMode=!selMode;sel.clear();render()},selone(id){sel.has(id)?sel.delete(id):sel.add(id);render()},
  bulkdone(){S.tasks.filter(t=>sel.has(t.id)).forEach(t=>{t.status='done';t.doneAt=new Date().toISOString()});sel.clear();selMode=false;save();render()},
  bulkdel(){if(confirm(`Delete ${sel.size} task(s)?`)){S.tasks=S.tasks.filter(t=>!sel.has(t.id));sel.clear();selMode=false;save();render()}},
  start(id){stopTimer();S.timer={id,start:Date.now()};get(S.tasks,id).status='progress';save();render()},
  stop(){stopTimer();render()},
  finish(){const t=get(S.tasks,S.timer.id);stopTimer();A.toggle(t.id,true)},
  log(id){const m=parseInt(prompt('How many minutes?','30'));if(m>0){S.logs.push({taskId:id,mins:m,date:new Date().toISOString()});save();render()}},
  toggle(id,forceDone){const t=get(S.tasks,id),d=forceDone||t.status!=='done';t.status=d?'done':'pending';t.doneAt=d?new Date().toISOString():null;if(d)burst();
    if(d&&t.repeat){const n=new Date(t.due);n.setDate(n.getDate()+7);S.tasks.push({...t,id:uid(),status:'pending',doneAt:null,notified:0,due:isoLocal(n)})}save();render()},
  resched(){const d=new Date();d.setDate(d.getDate()+1);d.setHours(23,0,0,0);S.tasks.filter(overdue).forEach(t=>t.due=isoLocal(d));save();render()},
  voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice input is not supported in this browser. Try Chrome or Safari.');const r=new R();r.lang='en-US';r.onresult=e=>{$('#qa').value=e.results[0][0].transcript;A.quick()};r.start()},
  async split(id){const t=get(S.tasks,id);if(!S.apiKey)return openSettings('Add an API key to break tasks down.');
    const d=$('#dlg');d.innerHTML='<h2>Breaking it down…</h2>';d.showModal();
    try{const txt=await claude(`Task: "${t.title}". Notes: ${t.notes||'none'}. Due ${t.due}. Total time ${t.est} min. Break it into 3-6 concrete steps a student can finish in one sitting. Reply ONLY with a JSON array of {"title":string,"estMinutes":number}.`,'You split big tasks into small, concrete steps.',600);
      reviewImport(JSON.parse(txt.slice(txt.indexOf('['),txt.lastIndexOf(']')+1)).map(x=>({...x,due:t.due,priority:t.priority,category:t.category})))}
    catch(e){d.innerHTML=`<h2>Couldn't break that down</h2><p>${esc(e.message)}</p><button data-a="close">Close</button>`}},
  ics(){const now=new Date(),k=dayKey(now).replace(/-/g,''),tm=m=>k+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';
    const it=[...busyFor(now).map(b=>({s:b.s,e:b.e,n:b.name})),...(S.plan?.date===dayKey(now)?S.plan.items.filter(i=>i.type==='task').map(i=>({s:i.start,e:i.end,n:'Focus: '+(get(S.tasks,i.taskId)?.title||'')})):[])];
    const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tempo//EN',...it.flatMap(x=>['BEGIN:VEVENT','UID:'+uid()+'@tempo','DTSTAMP:'+k+'T000000','DTSTART:'+tm(x.s),'DTEND:'+tm(x.e),'SUMMARY:'+x.n.replace(/[,;\n]/g,' '),'END:VEVENT']),'END:VCALENDAR'].join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download='tempo-today.ics';a.click()},
  cont(){authMode='in';enterLocal()},
  copycode(){navigator.clipboard?.writeText(newCodeShown)},
  dlcode(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['Tempo recovery code for '+LEMAIL+'\n'+newCodeShown+'\n'],{type:'text/plain'}));a.download='tempo-recovery-code.txt';a.click()},
  amode(id){authMode=id;authMsg='';authScreen()},
  notify(){'Notification' in window?Notification.requestPermission().then(p=>alert(p==='granted'?'Alerts are on. Keep this tab open to get them.':'Alerts are blocked in your browser settings.')):alert('This browser does not support alerts.')}
};
document.addEventListener('click',e=>{
  const n=e.target.closest('nav a[data-v]');if(n){view=n.dataset.v;render();return}
  if(e.target.id==='settings'){openSettings();return}
  if(e.target.id==='lock'){lock();return}
  const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset.id);
});
document.addEventListener('submit',async e=>{if(e.target.id!=='au')return;e.preventDefault();
  const f=new FormData(e.target),em=(f.get('e')||'').trim(),pw=f.get('p')||'',say=m=>{authMsg=m;const x=$('#err');if(x)x.textContent=m};
  if(LOCAL){
    if(!window.crypto?.subtle)return say('Encryption needs https or localhost. Run python3 -m http.server 8000 and open localhost:8000.');
    say('Working…');
    try{
      if(authMode==='in'){await localSignIn(em,pw);enterLocal()}
      else if(authMode==='up'){newCodeShown=await localSignUp(em,pw);authMode='code';authScreen()}
      else{newCodeShown=await localReset(em,f.get('rc')||'',pw);await localSignIn(em,pw);authMode='code';authScreen()}
    }catch(x){say(x.message||'Something went wrong.')}return}
  say('Working…');
  try{
    if(authMode==='in'){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
    else if(authMode==='up'){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:HOME}});if(error)throw error;
      if(!data.session){authMode='in';authMsg='Check your email and click the confirmation link, then sign in.';authScreen()}}
    else if(authMode==='forgot'){const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:HOME});if(error)throw error;authMode='in';authMsg='If that email has an account, a reset link is on its way. Check your spam folder too.';authScreen()}
    else{const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;authMode='in';const{data:{session}}=await sb.auth.getSession();history.replaceState(null,'',HOME);if(session)await enter(session)}
  }catch(x){say(x.message||'Something went wrong.')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qa')A.quick()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='photo'&&t.files[0]){importPhoto(t.files[0]);t.value=''}
  if(t.dataset.av!==undefined){const a={...avail(t.dataset.av)};a[t.dataset.f]=t.dataset.f==='on'?t.checked:t.value;S.avail[t.dataset.av]=a;save()}
  if(t.id==='fcat'){fcat=t.value;render()}if(t.id==='fpri'){fpri=t.value;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const p=e.target.selectionStart;render();const s=$('#search');s.focus();s.setSelectionRange(p,p)}});
function render(){
  document.body.classList.toggle('locked',!USER);if(!USER)return authScreen();
  $('#who').textContent=USER.email||'';
  document.querySelectorAll('nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('#app').innerHTML={dash:viewDash,tasks:viewTasks,sched:viewSched,stats:viewStats}[view]();tick();
}
render();
</script>
</body>
</html>
